  <header class="page-header">
    <div class="container">
      <h1 class="fw-bold">Hubungi Saya</h1>
      <p>Silakan menghubungi saya melalui informasi berikut.</p>
    </div>
  </header>

  <section class="section-padding">
    <div class="container">
      <div class="row g-4">

        <div class="col-lg-5">
          <div class="custom-card">
            <h3>Informasi Kontak</h3>
            <hr>

            <p><i class="bi bi-envelope-fill text-primary me-2"></i>
              ekasuhendar001@gmail.com
            </p>

            <p><i class="bi bi-telephone-fill text-primary me-2"></i>
              +62 895-8799-2563
            </p>

            <p><i class="bi bi-geo-alt-fill text-primary me-2"></i>
              Indonesia
            </p>

            <p><i class="bi bi-github text-primary me-2"></i>
              github.com/username
            </p>

            <p><i class="bi bi-instagram text-primary me-2"></i>
              @ekaaacipta_
            </p>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="custom-card">
            <h3 class="mb-4">Kirim Pesan</h3>

            <form id="contactForm">
              <div class="mb-3">
                <label for="nama" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="nama"
                  placeholder="Masukkan nama Anda" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email"
                  placeholder="Masukkan email Anda" required>
              </div>

              <div class="mb-3">
                <label for="pesan" class="form-label">Pesan</label>
                <textarea class="form-control" id="pesan" rows="5"
                  placeholder="Tulis pesan Anda" required></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-send"></i> Kirim Pesan
              </button>
            </form>

            <div id="formAlert" class="alert alert-info mt-3 d-none"></div>
          </div>
        </div>

      </div>
    </div>
  </section>
